name: Test

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

permissions: {}

jobs:
  pytest:
    name: "Pytest"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install requirements
        run: python3 -m pip install -r requirements.txt -r requirements_test.txt

      - name: Link custom component for tests
        run: |
          TESTING_CONFIG="$(python3 -c 'from pathlib import Path; import site; print(Path(site.getsitepackages()[0]) / "pytest_homeassistant_custom_component" / "testing_config" / "custom_components")')"
          mkdir -p "$TESTING_CONFIG"
          ln -sfn "$(pwd)/custom_components/savs" "$TESTING_CONFIG/savs"

      - name: Run tests
        run: python3 -m pytest
